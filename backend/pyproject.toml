[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beat-analysis-engine"
version = "1.0.0"
description = "CPU-only modular beat/downbeat analysis engine powered by Beat This!"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "einops>=0.7",
  "rotary-embedding-torch>=0.5",
  "soxr>=0.3",
  "soundfile>=0.12",
  "tqdm",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
beatthis = ["beat-this==1.1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]
